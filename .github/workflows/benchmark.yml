name: Benchmark

on:
  push:
    branches: [main, new-rewrite]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Wait 30 min to batch commits
        run: |
          echo "Sleeping 30 min to batch rapid commits..."
          sleep 1800

      - name: Check if newer commit exists (skip if batched)
        id: check
        run: |
          git fetch origin ${{ github.ref_name }} --depth 1
          HEAD_SHA=$(git rev-parse HEAD)
          ORIGIN_SHA=$(git rev-parse origin/${{ github.ref_name }})
          echo "HEAD $HEAD_SHA"
          echo "ORIGIN $ORIGIN_SHA"
          echo "EVENT ${{ github.sha }}"
          if [ "$HEAD_SHA" != "${{ github.sha }}" ] || [ "$ORIGIN_SHA" != "${{ github.sha }}" ]; then
            echo "Newer commit detected — skipping this run (will be covered by latest)."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip == 'false'
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip == 'false'
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        if: steps.check.outputs.skip == 'false'
        run: npm ci

      - name: Install ImageMagick (for benchmark.png)
        if: steps.check.outputs.skip == 'false'
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Run Stage1 tests
        if: steps.check.outputs.skip == 'false'
        run: node test/test.js

      - name: Run Stage1 corpus bench
        if: steps.check.outputs.skip == 'false'
        run: node test_corpus.mjs | tee bench-stage1.txt

      - name: Run Full pipeline bench (vs GPT-4o + LLaMA)
        if: steps.check.outputs.skip == 'false'
        run: |
          node -e "
          import llamaTokenizer from 'llama-tokenizer-js';
          import {encode as gptEncode} from 'gpt-tokenizer';
          import {encode as aiclEncode} from './src/encoder.js';
          import {tokenize, loadTokenizer} from './src/tokenizer/index.js';
          const v=loadTokenizer();
          const tests=[
            ['Common English','the quick brown fox jumps over the lazy dog this is a test of the emergency broadcast system how now brown cow the rain in spain stays mainly on the plain'],
            ['Code','const app = express(); app.get(\"/api/tasks\", async (req, res) => { const tasks = await db.query(\"SELECT * FROM tasks\"); res.json(tasks); });'],
            ['SQL','SELECT * FROM users WHERE id=42 AND name LIKE \\'%test%\\' ORDER BY created_at DESC;'],
            ['API','{\"status\": \"success\", \"data\": {\"users\": [{\"id\": 1, \"name\": \"John\", \"email\": \"john@example.com\"}]}}'],
            ['Your string','aicl is Goated BTW, and this can reduce tokens very vary fast fdslkjfl kjlkdfjl sdaj aowryhka bdfssdaaasd[okaspduaosndlkah98[h9[yf[a\\''],
          ];
          console.log('Test | GPT-4o | LLaMA2 | AICL | Win');
          for(const [n,raw] of tests){
            const g=gptEncode(raw).length;
            const l=llamaTokenizer.encode(raw).length;
            const a=tokenize(aiclEncode(raw).output, v).length;
            console.log(n+' | '+g+' | '+l+' | '+a+' | '+(Math.min(g,l)/a).toFixed(2)+'x');
          }
          " | tee bench-full.txt

      - name: Regenerate benchmarks (if needed)
        if: steps.check.outputs.skip == 'false'
        run: |
          # Keep existing assets/benchmark*.png as source of truth
          # Or regenerate via: node scripts/build_corpus.js && node scripts/gen-benchmark.js
          ls -lh assets/benchmark*.png || true

      - name: Upload bench results
        if: steps.check.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: |
            bench-*.txt
            assets/benchmark*.png
          retention-days: 30

      - name: Comment on commit
        if: steps.check.outputs.skip == 'false'
        uses: peter-evans/commit-comment@v3
        with:
          body: |
            **Benchmark — ${{ github.sha }}**
            - Stage1: see `bench-stage1.txt`
            - Full pipeline (vs GPT-4o/LLaMA): see `bench-full.txt`
            - Artifacts: benchmark PNGs
