name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y imagemagick
      - run: node test/test.js
      - run: node test_corpus.mjs | tee bench-stage1.txt
      - run: |
          node -e "
          import llamaTokenizer from 'llama-tokenizer-js';
          import {encode as gptEncode} from 'gpt-tokenizer';
          import {encode as aiclEncode} from './src/encoder.js';
          import {tokenize, loadTokenizer} from './src/tokenizer/index.js';
          const v=loadTokenizer();
          const tests=[
            ['Common English','the quick brown fox jumps over the lazy dog this is a test of the emergency broadcast system how now brown cow the rain in spain stays mainly on the plain'],
            ['Code','const app = express(); app.get(\"/api/tasks\", async (req, res) => { const tasks = await db.query(\"SELECT * FROM tasks\"); res.json(tasks); });'],
            ['SQL','SELECT * FROM users WHERE id=42 AND name LIKE \\'%test%\\' ORDER BY created_at DESC;'],
            ['API','{\"status\": \"success\", \"data\": {\"users\": [{\"id\": 1, \"name\": \"John\", \"email\": \"john@example.com\"}]}}'],
            ['Prompt','aicl is Goated BTW, and this can reduce tokens very vary fast fdslkjfl kjlkdfjl sdaj aowryhka bdfssdaaasd[okaspduaosndlkah98[h9[yf[a\\''],
          ];
          console.log('Test | GPT-4o | LLaMA2 | AICL | Win');
          for(const [n,raw] of tests){
            const g=gptEncode(raw).length;
            const l=llamaTokenizer.encode(raw).length;
            const a=tokenize(aiclEncode(raw).output, v).length;
            console.log(n+' | '+g+' | '+l+' | '+a+' | '+(Math.min(g,l)/a).toFixed(2)+'x');
          }
          " | tee bench-full.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: |
            bench-*.txt
            assets/benchmark*.png
          retention-days: 30
