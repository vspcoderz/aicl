  <rect x="0" y="348" width="12" height="118" fill="#ef4444"/><rect x="14" y="348" width="12" height="118" fill="#f97316"/><rect x="28" y="348" width="12" height="118" fill="#eab308"/><rect x="42" y="348" width="12" height="118" fill="#22c55e"/><rect x="56" y="348" width="12" height="118" fill="#06b6d4"/><rect x="70" y="374" width="12" height="92" fill="#a78bfa"/>
