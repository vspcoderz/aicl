<g transform="translate(36,70)">
  <rect x="0" y="0" width="10" height="10" fill="#ef4444"/><text x="14" y="9" class="s">gpt2</text>
  <rect x="52" y="0" width="10" height="10" fill="#f97316"/><text x="66" y="9" class="s">r50k</text>
  <rect x="92" y="0" width="10" height="10" fill="#eab308"/><text x="106" y="9" class="s">p50k</text>
  <rect x="142" y="0" width="10" height="10" fill="#22c55e"/><text x="156" y="9" class="s">cl100k</text>
  <rect x="204" y="0" width="10" height="10" fill="#06b6d4"/><text x="218" y="9" class="s">o200k</text>
  <rect x="264" y="0" width="10" height="10" fill="#a78bfa"/><text x="278" y="9" class="s">AICL</text>
</g>
<!-- y grid 0-80 -->
<g stroke="#1a1a1e" stroke-width="1">
