  <text x="41" y="520" text-anchor="middle" class="n">Normal</text><text x="41" y="532" text-anchor="middle" class="n">Prompt</text><text x="41" y="550" text-anchor="middle" fill="#a78bfa" font-size="9" font-weight="700">1.06×</text>
