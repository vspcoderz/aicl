<svg width="900" height="620" xmlns="http://www.w3.org/2000/svg">
<style>.t{font:700 18px 'Inter',system-ui,sans-serif;fill:#f9fafb}.s{font:400 11px 'Inter',system-ui,sans-serif;fill:#9ca3af}.n{font:600 10px 'Inter',system-ui,sans-serif;fill:#e5e7eb}.a{font:400 9px 'Inter',system-ui,sans-serif;fill:#6b7280}.v{font:700 8px 'Inter',system-ui,sans-serif;fill:#fff}</style>
<rect width="900" height="620" rx="16" fill="#0a0a0a"/>
<text x="36" y="38" class="t">AICLTokenizer vs All OpenAI Tokenizers</text>
<text x="36" y="58" class="s">tokens — lower is better · 5 encodings + AICL (BPE 2-5 PUA → 1 token)</text>
