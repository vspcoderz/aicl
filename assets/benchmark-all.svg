</g>
<text x="48" y="110" class="a" text-anchor="end">80</text><text x="48" y="200" class="a" text-anchor="end">60</text><text x="48" y="290" class="a" text-anchor="end">40</text><text x="48" y="380" class="a" text-anchor="end">20</text><text x="48" y="470" class="a" text-anchor="end">0</text>

